<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DeutschDreams logo">
  <defs>
    <linearGradient id="dd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26306B"/>
      <stop offset="1" stop-color="#0E1430"/>
    </linearGradient>
    <linearGradient id="dd-warm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E5484D"/>
      <stop offset=".5" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#FFC83D"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#dd-bg)"/>
  <!-- flight path: Pakistan to Germany -->
  <path d="M9 44 C 18 24, 34 15, 50 14" fill="none" stroke="url(#dd-warm)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 5.2"/>
  <!-- paper plane -->
  <path d="M57 11 L43.5 15.2 L48.4 17.6 L49.6 23.4 L52 19.6 L56 21.5 Z" fill="#FFC83D"/>
  <path d="M48.4 17.6 L57 11 L49.6 23.4 Z" fill="#F2A900"/>
  <!-- Brandenburg-style gate -->
  <path d="M17 33.5 L32 28 L47 33.5 Z" fill="#FFF8EE"/>
  <rect x="16" y="34" width="32" height="3.6" rx="1" fill="#FFF8EE"/>
  <g fill="#FFF8EE">
    <rect x="18" y="38.6" width="3" height="11" rx=".8"/>
    <rect x="24.4" y="38.6" width="3" height="11" rx=".8"/>
    <rect x="36.6" y="38.6" width="3" height="11" rx=".8"/>
    <rect x="43" y="38.6" width="3" height="11" rx=".8"/>
  </g>
  <rect x="30.5" y="38.6" width="3" height="11" rx=".8" fill="url(#dd-warm)"/>
  <rect x="15" y="50" width="34" height="3.2" rx="1.2" fill="#FFF8EE"/>
</svg>
